<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Invited</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Hidden audio element; src points to music.mp3 in the same directory -->
  <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

  <!-- Mute / unmute toggle — top-right corner -->
  <button class="mute-btn" id="mute-btn" aria-label="Toggle music" title="Toggle music">
    <!-- Speaker icon (unmuted) — inline SVG for zero dependencies -->
    <svg class="icon-sound" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
    <!-- Muted icon — hidden initially -->
    <svg class="icon-muted" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>

  <!-- ============================================================
       SCENE — the single container that manages overall state.
       JS adds .is-open to this element to switch between states.
  ============================================================ -->
  <main class="scene" id="scene">

    <!-- ── ENVELOPE (landing state) ────────────────────────── -->
    <section class="envelope-wrapper" id="envelope-wrapper" aria-label="Sealed invitation envelope">

      <!-- CSS-drawn envelope body -->
      <div class="envelope" id="envelope">
        <!-- Envelope flap (the triangle fold at the top) -->
        <div class="envelope__flap" id="envelope-flap"></div>
        <!-- Decorative wax-seal in the center of the flap fold -->
        <div class="envelope__seal">
          <span class="envelope__seal-initial">✦</span>
        </div>
        <!-- Bottom body of the envelope -->
        <div class="envelope__body"></div>
      </div>

      <!-- Pulsing call-to-action label -->
      <p class="cta-label" id="cta-label">Click to open your invitation</p>

    </section>
    <!-- ── /ENVELOPE ────────────────────────────────────────── -->


    <!-- ── CARD (revealed state) ────────────────────────────── -->
    <!--
      Structure:
        .card-scene   — perspective container
          .card       — the element that actually rotates on flip
            .card__face--front  — card-front.png
            .card__face--back   — card-back.png

      JS toggles .is-flipped on .card to trigger the Y-axis flip.
    -->
    <section class="card-scene" id="card-scene" aria-label="Invitation card" hidden>
      <div class="card" id="card">
        <div class="card__face card__face--front">
          <img src="card-front.png" alt="Invitation front" draggable="false" />
        </div>
        <div class="card__face card__face--back">
          <img src="card-back.png" alt="Invitation back" draggable="false" />
        </div>
      </div>

      <!-- Flip affordance — tapping/clicking the card also works -->
      <button class="flip-btn" id="flip-btn" aria-label="Flip invitation card">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <polyline points="23 20 23 14 17 14"></polyline>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"></path>
        </svg>
        <span>Flip card</span>
      </button>
    </section>
    <!-- ── /CARD ─────────────────────────────────────────────── -->

  </main>

  <script src="script.js"></script>
</body>
</html>
