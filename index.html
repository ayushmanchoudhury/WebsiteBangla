<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Invited</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

  <!-- Music toggle — top-right -->
  <button class="mute-btn" id="mute-btn" aria-label="Toggle music" title="Toggle music">
    <svg class="icon-sound" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
    <svg class="icon-muted" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>

  <main class="scene" id="scene">

    <!-- ══════════════════════════════════════════════
         STATE 1 — ENVELOPE
    ══════════════════════════════════════════════ -->
    <section class="envelope-stage" id="envelope-stage"
             role="button" tabindex="0" aria-label="Open your invitation">

      <!-- Gold sparkles that fly when seal pops -->
      <div class="sparks" id="sparks" aria-hidden="true">
        <span class="spark spark-1"></span>
        <span class="spark spark-2"></span>
        <span class="spark spark-3"></span>
        <span class="spark spark-4"></span>
        <span class="spark spark-5"></span>
        <span class="spark spark-6"></span>
        <span class="spark spark-7"></span>
        <span class="spark spark-8"></span>
        <span class="spark spark-9"></span>
        <span class="spark spark-10"></span>
      </div>

      <!-- ─── THE ENVELOPE ──────────────────────────── -->
      <div class="env" id="env">

        <!--
          Layer order (z-index):
            1. env__body   — the rectangular envelope shell
            2. env__letter — the letter card, rises up through the opening
            3. env__flap   — the triangular flap that rotates open
        -->

        <!-- 1 · Envelope body + fold-line decoration -->
        <div class="env__body" id="env-body">
          <!-- Golden inside lining (visible once flap lifts) -->
          <div class="env__inside" id="env-inside"></div>
          <!-- Bottom V-fold (purely decorative) -->
          <div class="env__vfold" aria-hidden="true"></div>
        </div>

        <!-- 2 · Letter that rises out of the envelope -->
        <div class="env__letter" id="env-letter" aria-hidden="true">
          <div class="env__letter-border">
            <div class="env__letter-inner">
              <span class="env__letter-ornament">✦</span>
              <p class="env__letter-sub">You Are</p>
              <p class="env__letter-main">Cordially<br>Invited</p>
              <span class="env__letter-ornament">✦</span>
            </div>
          </div>
        </div>

        <!-- 3 · Flap (3-D rotating triangle) + wax seal -->
        <div class="env__flap-scene" id="env-flap-scene">
          <div class="env__flap" id="env-flap">

            <!-- Wax seal — sits at the flap's lower point -->
            <div class="env__seal" id="env-seal">
              <div class="env__seal-disc" id="env-seal-disc">
                <span class="env__seal-glyph">✦</span>
              </div>
              <!-- Crack lines animate when seal pops -->
              <div class="env__seal-crack env__seal-crack--a"></div>
              <div class="env__seal-crack env__seal-crack--b"></div>
              <div class="env__seal-crack env__seal-crack--c"></div>
            </div>

          </div>
        </div>

      </div><!-- /env -->

      <!-- Pulsing CTA below the envelope -->
      <p class="cta-label" id="cta-label">Click to open your invitation</p>

    </section><!-- /envelope-stage -->


    <!-- ══════════════════════════════════════════════
         STATE 2 — CARD
    ══════════════════════════════════════════════ -->
    <section class="card-scene" id="card-scene" aria-label="Invitation card" hidden>
      <div class="card" id="card"
           role="button" tabindex="0" aria-label="Flip invitation card">

        <!-- ─── FRONT FACE ────────────────────────── -->
        <div class="card__face card__face--front">
          <div class="cf-front">
            <!-- outer gold frame lines -->
            <div class="cf-frame" aria-hidden="true">
              <span class="cf-corner cf-corner--tl"></span>
              <span class="cf-corner cf-corner--tr"></span>
              <span class="cf-corner cf-corner--bl"></span>
              <span class="cf-corner cf-corner--br"></span>
            </div>
            <div class="cf-body">
              <p  class="cf-ornament">✦</p>
              <p  class="cf-overline">You Are</p>
              <h1 class="cf-title">Cordially<br>Invited</h1>
              <div class="cf-rule"></div>
              <p  class="cf-date">Saturday · the First of June</p>
              <p  class="cf-time">Six o'clock in the evening</p>
              <p  class="cf-ornament cf-ornament--trio">✦ &nbsp; ✦ &nbsp; ✦</p>
            </div>
          </div>
        </div>

        <!-- ─── BACK FACE ─────────────────────────── -->
        <div class="card__face card__face--back">
          <div class="cf-back">
            <div class="cf-back-pattern" aria-hidden="true"></div>
            <div class="cf-frame" aria-hidden="true">
              <span class="cf-corner cf-corner--tl"></span>
              <span class="cf-corner cf-corner--tr"></span>
              <span class="cf-corner cf-corner--bl"></span>
              <span class="cf-corner cf-corner--br"></span>
            </div>
            <div class="cf-body cf-body--back">
              <p  class="cf-back-label">R.S.V.P.</p>
              <div class="cf-rule cf-rule--cream"></div>
              <p  class="cf-back-copy">We look forward<br>to celebrating<br>with you</p>
              <p  class="cf-ornament cf-ornament--green">✦</p>
            </div>
          </div>
        </div>

      </div>

      <button class="flip-btn" id="flip-btn" aria-label="Flip invitation card">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <polyline points="23 20 23 14 17 14"></polyline>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"></path>
        </svg>
        <span>Flip card</span>
      </button>
    </section><!-- /card-scene -->

  </main>

  <script src="script.js"></script>
</body>
</html>
